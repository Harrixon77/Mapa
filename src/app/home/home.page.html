<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Map 
    </ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content> 
  <ion-fab vertical="top" horizontal="end" slot="fixed">
  <ion-fab-button (click)="centrarEnMiUbicacion()">📍</ion-fab-button>
</ion-fab>
<div id ="map" style="width: 100% ; height: 100%;"></div>
<!-- ===== PANEL NUEVO (empieza aquí) ===== -->
  @if (puntoSeleccionado(); as punto) {
    <div class="panel-punto">
      <div class="panel-header">
        <div>
          <h3>{{ punto.nombre }}</h3>
          <small>{{ punto.typo }}</small>
        </div>
        <ion-button fill="clear" size="small" (click)="cerrarPanel()">✕</ion-button>
      </div>
 
      @if (fotoActual(); as foto) {
        <img [src]="foto" alt="Foto del lugar" />
      } @else {
        <p>Aún no hay foto de este lugar.</p>
      }

      <ion-button expand="block" (click)="tomarFoto()">
        {{ fotoActual() ? 'Retomar foto' : 'Tomar foto' }}
      </ion-button>
    </div>
  }
  <!-- ===== PANEL NUEVO (termina aquí) ===== -->
</ion-content>
