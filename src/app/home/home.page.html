<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Map 
    </ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content> 
  <ion-fab vertical="top" horizontal="end" slot="fixed">
  <ion-fab-button (click)="centrarEnMiUbicacion()">📍</ion-fab-button>
</ion-fab>
<div id ="map" style="width: 100% ; height: 100%;"></div>
<!-- ===== PANEL NUEVO (empieza aquí) ===== -->
  @if (puntoSeleccionado(); as punto) {
    <div class="panel-punto">
      <div class="panel-header">
        <div>
          <h3>{{ punto.nombre }}</h3>
          <small>{{ punto.typo }}</small>
        </div>
        <ion-button fill="clear" size="small" (click)="cerrarPanel()">✕</ion-button>
      </div>
 
      <div class="galeria">
  @for (foto of fotosActuales(); track $index) {
    <div class="foto-item">
      <img [src]="foto" alt="Foto de {{ punto.nombre }}" />
      <button class="borrar" (click)="borrarFoto($index)">✕</button>
    </div>
  } @empty {
    <p>Aún no hay fotos de este lugar.</p>
  }
</div>

<div class="acciones">
  <ion-button expand="block" [disabled]="fotosActuales().length >= maxFotos" (click)="tomarFoto()">
    📷 Tomar foto
  </ion-button>

  <ion-button expand="block" fill="outline" [disabled]="fotosActuales().length >= maxFotos" (click)="subirDeGaleria()">
    🖼️ Galería
  </ion-button>
</div>

<small class="contador">{{ fotosActuales().length }}/{{ maxFotos }} fotos</small>
    </div>
  }
  <!-- ===== PANEL NUEVO (termina aquí) ===== -->
</ion-content>
